# --- REMAINING OLD SQUARESPACE URLS GO BELOW ---
# Export the full list from Search Console, then add one block per URL:
#
# [[redirects]]
#   from = "/old-blog-post-slug"
#   to = "/resources/new-slug"
#   status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
